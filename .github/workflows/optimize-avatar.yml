name: Optimize avatar to WebP

on:
  push:
    paths:
      - ".github/workflows/optimize-avatar.yml"

permissions:
  contents: write

jobs:
  convert-avatar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Convert avatar to WebP
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          source = Image.open("images/avatar.png").convert("RGBA")
          source = source.resize((116, 116), Image.Resampling.LANCZOS)
          source.save("images/avatar.webp", "WEBP", quality=82, method=6)
          print(f"Created WebP avatar: {source.size}")
          PY

      - name: Commit optimized avatar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i 's#images/avatar\\.png#images/avatar.webp#g' index.html
          git add images/avatar.webp index.html
          if git diff --cached --quiet; then
            echo "No avatar changes to commit."
            exit 0
          fi
          git commit -m "Optimize profile avatar as WebP"
          git push
