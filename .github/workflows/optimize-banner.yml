name: Generate responsive profile banner

on:
  push:
    paths:
      - ".github/workflows/optimize-banner.yml"
      - "images/profile-banner.jpg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  responsive-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate responsive WebP variants
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          import os

          source = Image.open("images/profile-banner.jpg").convert("RGB")
          if source.width < 900:
              raise SystemExit(f"Source image is unexpectedly small: {source.size}")

          for width in (720, 900):
              height = round(source.height * width / source.width)
              resized = source.resize((width, height), Image.Resampling.LANCZOS)
              path = f"images/profile-banner-{width}.webp"
              resized.save(path, "WEBP", quality=80, method=6)
              print(f"{path}: {resized.size}, {os.path.getsize(path)} bytes")
          PY

      - name: Commit responsive image variants
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/profile-banner-720.webp images/profile-banner-900.webp
          if git diff --cached --quiet; then
            echo "Responsive banner variants are already up to date."
            exit 0
          fi
          git commit -m "Add responsive WebP profile banner variants"
          git pull --rebase origin main
          git push
