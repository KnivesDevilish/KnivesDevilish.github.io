name: Optimize profile banner to WebP

on:
  push:
    paths:
      - ".github/workflows/optimize-banner.yml"

permissions:
  contents: write

jobs:
  convert-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Convert profile banner to WebP
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          source = Image.open("images/profile-banner.jpg").convert("RGB")
          original_size = source.size
          source.save("images/profile-banner.webp", "WEBP", quality=80, method=6)
          import os
          print(f"Converted {original_size} to WebP ({os.path.getsize('images/profile-banner.webp')} bytes)")
          PY

      - name: Commit optimized banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/profile-banner.webp
          if git diff --cached --quiet; then
            echo "No banner changes to commit."
            exit 0
          fi
          git commit -m "Optimize profile banner as WebP"
          git pull --rebase origin main
          git push
